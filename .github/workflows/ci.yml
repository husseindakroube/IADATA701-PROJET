name: CI / CD

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  UV_VERSION: '0.12.13'
  MPLBACKEND: Agg
  STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'

jobs:
  checks:
    name: Code, tests et couverture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Installation de l’environnement verrouillé
        run: uv sync --locked --dev
      - name: Vérification PEP 8, erreurs Python et présence des docstrings
        run: uv run --locked ruff check app src tests scripts docs/conf.py
      - name: Vérification du formatage
        run: uv run --locked ruff format --check app src tests scripts docs/conf.py
      - name: Vérification de la syntaxe Python
        run: uv run --locked python -m compileall -q app src scripts
      - name: Construction de la documentation Sphinx sans avertissement
        run: uv run --locked sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Génération de journaux de démonstration sans données réelles
        run: uv run --locked python scripts/deployment/generate_log_examples.py reports/log-examples
      - name: Exécution des tests, dont les six pages Streamlit
        run: >-
          uv run --locked pytest -q
          --cov=src/projet_kit_data --cov=app
          --cov-fail-under=90.1 --cov-report=term-missing:skip-covered
          --cov-report=xml:reports/coverage.xml
          --cov-report=html:reports/coverage
          --junitxml=reports/pytest.xml
      - name: Conservation des rapports même en cas d’échec
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports-${{ github.sha }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Conservation de la documentation HTML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sphinx-html-${{ github.sha }}
          path: docs/_build/html/
          if-no-files-found: warn
          retention-days: 14

  image:
    name: Construction et vérification de l’image Docker
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      reference: ${{ steps.publish.outputs.reference }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Nom de l’image
        id: name
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "tag=ghcr.io/${REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: ${{ steps.name.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vérification réelle de la santé du conteneur
        env:
          IMAGE: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          docker run -d --name tgvision-smoke "$IMAGE"
          trap 'docker logs tgvision-smoke; docker rm -f tgvision-smoke' EXIT
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' tgvision-smoke)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then exit 1; fi
            sleep 2
          done
          exit 1
      - name: Chargement des six pages dans l’image de production
        env:
          IMAGE: ${{ steps.name.outputs.tag }}
        run: >-
          docker run --rm --network none
          --entrypoint /app/.venv/bin/python
          "$IMAGE" scripts/deployment/smoke_app.py
      - name: Authentification auprès de GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publication de l’image exacte testée
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          docker push "$IMAGE"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE")
          echo "reference=$digest" >> "$GITHUB_OUTPUT"
          echo "Image publiée : $digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Déploiement sur le serveur de production
    needs: image
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: tgvision-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Déploiement de l’image immuable par SSH vérifié
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_IMAGE: ${{ needs.image.outputs.reference }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/deployment/deploy.py
