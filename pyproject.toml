[project]
name = "projet-kit-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mianzha", email = "144988642+mianzha@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "folium>=1.0.0",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "pandas>=2.2",
    "plotly>=5.24",
    "polars>=2.1.0",
    "pyarrow>=18",
    "requests>=2.32,<3",
    "scikit-learn==1.9.1",
    "scipy>=1.18.1",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
    "streamlit>=1.67.0",
    "streamlit-folium>=0.27.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "sphinx==9.1.1",
]

[project.scripts]
projet-kit-data = "projet_kit_data:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
addopts = "-ra"

[tool.coverage.report]
precision = 2

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "D1"]
# Le formateur gère les lignes de code ; les URL et textes affichés peuvent
# dépasser la largeur sans être coupés artificiellement.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]
