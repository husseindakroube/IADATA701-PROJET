[project]
name = "sncf-rail-insight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "wals22", email = "dhouib.walid22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[project.scripts]
sncf-rail-insight = "sncf_rail_insight:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]
