[project]
name = "projet-kit-data"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mianzha", email = "144988642+mianzha@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.5",
    "polars>=2.1.0",
    "requests>=2.32,<3",
    "scipy>=1.18.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[project.scripts]
projet-kit-data = "projet_kit_data:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
